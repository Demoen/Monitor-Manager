name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build release assets
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Validate tag and Cargo version
        id: version
        shell: pwsh
        run: |
          $version = ./.github/scripts/Test-ReleaseVersion.ps1 -ManifestPath monitor-manager-rust/Cargo.toml -Tag $env:GITHUB_REF_NAME
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run release checks
        shell: pwsh
        run: |
          cargo +1.95.0 fmt --manifest-path monitor-manager-rust/Cargo.toml --all -- --check
          cargo +1.95.0 clippy --manifest-path monitor-manager-rust/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo +1.95.0 test --manifest-path monitor-manager-rust/Cargo.toml --all-targets --all-features --locked

      - name: Build release executable and symbols
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "1"
        run: cargo +1.95.0 build --manifest-path monitor-manager-rust/Cargo.toml --release --locked

      - name: Sign executable when configured
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./.github/scripts/Invoke-OptionalSigning.ps1 -ExecutablePath monitor-manager-rust/target/release/monitor-manager.exe

      - name: Create portable package and symbol archive
        shell: pwsh
        run: |
          ./.github/scripts/New-ReleaseAssets.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -ExecutablePath monitor-manager-rust/target/release/monitor-manager.exe `
            -PdbPath monitor-manager-rust/target/release/monitor_manager.pdb `
            -OutputDirectory dist

      - name: Generate CycloneDX SBOM
        shell: pwsh
        run: |
          ./.github/scripts/New-CargoSbom.ps1 `
            -ManifestPath monitor-manager-rust/Cargo.toml `
            -OutputPath "dist/MonitorManager-v${{ steps.version.outputs.version }}-sbom.cdx.json"

      - name: Create SHA-256 manifest
        shell: pwsh
        run: |
          ./.github/scripts/New-ChecksumManifest.ps1 `
            -AssetDirectory dist `
            -OutputPath "dist/MonitorManager-v${{ steps.version.outputs.version }}-SHA256SUMS.txt"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit RustSec advisories
        run: cargo audit --file monitor-manager-rust/Cargo.lock

      - name: Check dependency licenses and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: monitor-manager-rust/Cargo.toml
          rust-version: "1.95.0"
          arguments: --all-features --locked

  publish:
    name: Publish GitHub release
    needs: [build, policy]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release-assets

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object FullName)
          if ($assets.Count -eq 0) {
              throw "No release assets were downloaded."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $assets --clobber
          } else {
              gh release create $tag $assets --verify-tag --generate-notes --title "Monitor Manager ${{ needs.build.outputs.version }}"
          }

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release publication failed."
          }
