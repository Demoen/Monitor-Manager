[package]
name = "monitor-manager"
version = "1.1.0"
edition = "2021"
rust-version = "1.95"
description = "A reliable Windows tray utility that changes monitor topology while selected applications run"
license = "MIT"
repository = "https://github.com/Demoen/Monitor-Manager"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
native-windows-gui = { version = "1.0", default-features = false, features = [
    "cursor",
    "dynamic_layout",
    "embed-resource",
    "file-dialog",
    "frame",
    "high-dpi",
    "listbox",
    "menu",
    "message-window",
    "notice",
    "status-bar",
    "tray-notification",
] }
native-windows-derive = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[build-dependencies]
embed-resource = "2.4"
